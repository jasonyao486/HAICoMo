name: Verify anonymous release downloads
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version, without v
        type: string
        required: true
      manifest:
        description: Published SHA256SUMS manifest filename
        type: string
        required: true
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MANIFEST: ${{ inputs.manifest }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Download without credentials and verify every file
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_MANIFEST" =~ ^SHA256SUMS-[a-z0-9-]+\.txt$ ]]
          base="https://github.com/$REPOSITORY/releases/download/v$RELEASE_VERSION"
          mkdir downloads
          cd downloads
          curl --fail --location --retry 5 "$base/$RELEASE_MANIFEST" -o "$RELEASE_MANIFEST"
          while read -r hash name; do
            [[ "$hash" =~ ^[a-f0-9]{64}$ ]]
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
            curl --fail --location --retry 5 "$base/$name" -o "$name"
          done < "$RELEASE_MANIFEST"
          sha256sum -c "$RELEASE_MANIFEST"
