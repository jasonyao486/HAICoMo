name: Verify and package
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README*.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platforms to verify
        type: choice
        options: [all, mac, windows]
        default: all
      resume_run_id:
        description: Earlier main Mac verification run to resume
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platform == 'mac' && '{"include":[{"os":"macos-15","platform":"mac","arch":"arm64"}]}' || inputs.platform == 'windows' && '{"include":[{"os":"windows-2025","platform":"windows","arch":"x64"}]}' || '{"include":[{"os":"macos-15","platform":"mac","arch":"arm64"},{"os":"windows-2025","platform":"windows","arch":"x64"}]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: node scripts/ci-version.mjs
      - run: npm ci
      - run: npm run check:public
      - run: npm run typecheck
      - run: npx tsx --test --test-reporter=tap tests/*.test.ts
        timeout-minutes: 5
      - run: npm run build
      - run: npx playwright test
        timeout-minutes: 10
      - name: Package unsigned macOS PR validation
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        run: npx electron-builder --mac --arm64 --publish never
      - name: Restore saved Mac candidate
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: node scripts/restore-mac-candidate.mjs
      - name: Prepare signed Mac application
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release-mac.mjs prepare
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: mac-candidate-${{ env.HAICOMO_VERSION }}-prepared
          path: release/${{ env.HAICOMO_VERSION }}/mac-checkpoint/
          if-no-files-found: error
          retention-days: 14
      - name: Test signed Mac candidate before notarization
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          export HAICOMO_PACKAGED_EXECUTABLE="$PWD/release/$HAICOMO_VERSION/mac-arm64/HAICoMo.app/Contents/MacOS/HAICoMo"
          node scripts/check-package.mjs "release/$HAICOMO_VERSION/mac-arm64/HAICoMo.app/Contents/Resources"
          npx playwright test
      - name: Mac release submit-app
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: node scripts/release-mac.mjs submit-app
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: mac-progress-${{ env.HAICOMO_VERSION }}-submit-app
          path: release/${{ env.HAICOMO_VERSION }}/mac-checkpoint/state.json
          if-no-files-found: error
          retention-days: 14
      - name: Mac release wait-app
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: node scripts/release-mac.mjs wait-app
      - name: Mac release package
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: node scripts/release-mac.mjs package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: mac-candidate-${{ env.HAICOMO_VERSION }}-packaged
          path: release/${{ env.HAICOMO_VERSION }}/mac-checkpoint/
          if-no-files-found: error
          retention-days: 14
      - name: Mac release submit-dmg
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: node scripts/release-mac.mjs submit-dmg
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: mac-progress-${{ env.HAICOMO_VERSION }}-submit-dmg
          path: release/${{ env.HAICOMO_VERSION }}/mac-checkpoint/state.json
          if-no-files-found: error
          retention-days: 14
      - name: Mac release wait-dmg
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: node scripts/release-mac.mjs wait-dmg
      - name: Mac release finalize
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release-mac.mjs finalize
      - name: Package Windows x64
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      - name: Test packaged macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export HAICOMO_PACKAGED_EXECUTABLE="$PWD/release/${{ env.HAICOMO_VERSION }}/mac-arm64/HAICoMo.app/Contents/MacOS/HAICoMo"
          node scripts/check-package.mjs release/${{ env.HAICOMO_VERSION }}/mac-arm64/HAICoMo.app/Contents/Resources
          npx playwright test
      - name: Test packaged Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HAICOMO_PACKAGED_EXECUTABLE = (Resolve-Path release/${{ env.HAICOMO_VERSION }}/win-unpacked/HAICoMo.exe).Path
          node scripts/check-package.mjs release/${{ env.HAICOMO_VERSION }}/win-unpacked/resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright test
          exit $LASTEXITCODE
      - name: Install Windows package into an isolated directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-Item release/${{ env.HAICOMO_VERSION }}/*-setup.exe).FullName
          $installDirectory = Join-Path $env:RUNNER_TEMP 'HAICoMo-install-check'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDirectory") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exit code: $($process.ExitCode)" }
          $env:HAICOMO_PACKAGED_EXECUTABLE = Join-Path $installDirectory 'HAICoMo.exe'
          if (!(Test-Path $env:HAICOMO_PACKAGED_EXECUTABLE)) { throw 'Installed executable is missing' }
          node scripts/check-package.mjs (Join-Path $installDirectory 'resources')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright test tests/e2e/v031.spec.ts tests/e2e/v032.spec.ts
          exit $LASTEXITCODE
      - name: Verify installation with a real standard-user token
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-user-install.ps1
      - name: Package checksums
        run: node scripts/package-checksums.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: haicomo-${{ env.HAICOMO_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/${{ env.HAICOMO_VERSION }}/*.dmg
            release/${{ env.HAICOMO_VERSION }}/*.zip
            release/${{ env.HAICOMO_VERSION }}/*.exe
            release/${{ env.HAICOMO_VERSION }}/*.blockmap
            release/${{ env.HAICOMO_VERSION }}/*-verification.json
            release/${{ env.HAICOMO_VERSION }}/SHA256SUMS*.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            test-results/
            validation/${{ env.HAICOMO_VERSION }}/
          retention-days: 14
      - name: Cleanup Mac signing keychain
        if: always() && runner.os == 'macOS' && github.event_name != 'pull_request'
        run: node scripts/release-mac.mjs cleanup
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS' && github.event_name != 'pull_request'
        with:
          name: mac-progress-${{ env.HAICOMO_VERSION }}-final
          path: release/${{ env.HAICOMO_VERSION }}/mac-checkpoint/state.json
          if-no-files-found: warn
          retention-days: 14
