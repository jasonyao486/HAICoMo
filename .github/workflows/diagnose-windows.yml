name: Diagnose Windows test runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entry-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24.12.0', '24.21.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node scripts/ci-version.mjs
      - run: npm ci
      - run: npm run build
      - run: npx playwright test tests/e2e/desktop.spec.ts
      - name: Collect native crash and step evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation/${{ env.HAICOMO_VERSION }} | Out-Null
          Get-ChildItem validation/${{ env.HAICOMO_VERSION }}/regression -Filter '*.jsonl' | Get-Content
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001} -MaxEvents 6 -ErrorAction SilentlyContinue | Select-Object TimeCreated,Message | Out-File validation/${{ env.HAICOMO_VERSION }}/native-events.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-${{ matrix.node }}
          path: |
            validation/${{ env.HAICOMO_VERSION }}/
            test-results/
          retention-days: 14
