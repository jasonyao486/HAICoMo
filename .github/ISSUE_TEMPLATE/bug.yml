name: Bug report / 问题反馈
description: Report a reproducible problem without private project data.
body:
  - type: input
    id: version
    attributes:
      label: App version / 应用版本
      placeholder: 0.3.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and architecture / 系统与架构
      placeholder: macOS 15 arm64 / Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result / 步骤、预期与实际结果
      description: Use a synthetic example. Remove names, paths, prompts and credentials from screenshots or diagnostics.
    validations:
      required: true
